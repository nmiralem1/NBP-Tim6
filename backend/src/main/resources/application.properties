spring.application.name=nbp_tim6

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
spring.flyway.enabled=true

spring.sql.init.mode=always

nbp.jwt.secret=${JWT_SECRET}
nbp.jwt.expirationMs=${JWT_EXPIRATION_MS:3600000}
nbp.jwt.refreshExpirationMs=${JWT_REFRESH_EXPIRATION_MS:604800000}
logging.level.org.springframework.security=DEBUG

stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

sendgrid.api.key=${SENDGRID_API_KEY}
sendgrid.from.email=${SENDGRID_FROM_EMAIL}
sendgrid.from.name=${SENDGRID_FROM_NAME}
